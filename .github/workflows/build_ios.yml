name: Build iOS (Unsigned for AltStore)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Create firebase_options.dart
        run: |
          cat <<EOF > lib/firebase_options.dart
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Build iOS (No codesign)
        run: flutter build ios --release --no-codesign

      - name: Install xcodeproj
        run: gem install xcodeproj

      - name: Integrate Apple Watch Target
        run: ruby ios/add_watch_target.rb

      - name: Rebuild with Watch App
        run: flutter build ios --release --no-codesign

      - name: Commit Podfile.lock
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ios/Podfile.lock

          if git diff --cached --quiet; then
            echo "No changes to Podfile.lock"
          else
            git commit -m "Update Podfile.lock [auto]"
            git push
          fi

      - name: Create IPA structure
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Scheduling.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scheduling-Unsigned-IPA
          path: Scheduling.ipa
          retention-days: 7

      - name: Debug Telegram Secrets
        run: |
          if [ -z "${{ env.TELEGRAM_TOKEN }}" ]; then
            echo "❌ TELEGRAM_TOKEN is missing"
          else
            echo "✅ TELEGRAM_TOKEN is set (length: ${#TELEGRAM_TOKEN})"
          fi
          if [ -z "${{ env.TELEGRAM_TO }}" ]; then
            echo "❌ TELEGRAM_TO is missing"
          else
            echo "✅ TELEGRAM_TO is set"
          fi

      - name: Send IPA to Telegram
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != ''
        run: |
          echo "📤 Invio file Scheduling.ipa a Telegram..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -F document=@"Scheduling.ipa" \
               -F chat_id="${{ env.TELEGRAM_TO }}" \
               -F caption="🚀 Nuova build iOS pronta! (it.onesto58.scheduling)" \
               https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status Code: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Errore durante l'invio a Telegram"
            exit 1
          else
            echo "✅ File inviato correttamente!"
          fi