name: Build iOS (Unsigned for AltStore)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Create firebase_options.dart
        run: |
          cat <<EOF > lib/firebase_options.dart
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Build iOS (No codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA structure
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Scheduling.ipa Payload
          # Pulizia per sicurezza
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scheduling-Unsigned-IPA
          path: Scheduling.ipa
          retention-days: 7

      - name: Upload Podfile.lock Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Podfile-Lock
          path: ios/Podfile.lock
          retention-days: 7
